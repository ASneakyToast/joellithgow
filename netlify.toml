[build]
  # Directory to change to before starting a build
  base = "."
  
  # Build command for Astro.js
  command = "npm run build"
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # ASTRAEUS_API_KEY is set in the Netlify dashboard per context — not committed

# Production context: deploys from main
[context.production]
  publish = "dist"
  command = "npm run build"
  [context.production.environment]
    ASTRAEUS_URL = "https://cms.joellithgow.com"
    PUBLIC_CMS_BASE = "https://cms.joellithgow.com"

# Deploy Preview context: deploys from pull requests
[context.deploy-preview]
  publish = "dist"
  command = "npm run build"
  [context.deploy-preview.environment]
    ASTRAEUS_URL = "https://cms-staging.joellithgow.com"
    PUBLIC_CMS_BASE = "https://cms-staging.joellithgow.com"

# Branch Deploy context: deploys from branches (not PRs, not main)
[context.branch-deploy]
  publish = "dist"
  command = "npm run build"
  [context.branch-deploy.environment]
    ASTRAEUS_URL = "https://cms-staging.joellithgow.com"
    PUBLIC_CMS_BASE = "https://cms-staging.joellithgow.com"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Static assets caching - Astro uses different asset structure
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Astro generated CSS and JS files
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and media files
[[headers]]
  for = "/*.{png,jpg,jpeg,gif,webp,svg,webm,mp4}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"