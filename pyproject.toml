dependencies = [
    "starlette-cms[mcp]>=0.4.0",
    "starlette-editor>=0.2.0",
    "uvicorn[standard]>=0.30.0",
    "piccolo[sqlite]>=1.0.0",
    "httpx>=0.27.0",
