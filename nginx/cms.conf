# Nginx config for CMS subdomains
# Deploy to /etc/nginx/sites-available/cms.conf and symlink to sites-enabled/
# SSL certs provisioned via: /ssl-setup user@host cms.joellithgow.com
#                         and /ssl-setup user@host cms-staging.joellithgow.com

server {
    listen 443 ssl;
    server_name cms.joellithgow.com;

    ssl_certificate     /etc/letsencrypt/live/cms.joellithgow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.joellithgow.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name cms-staging.joellithgow.com;

    ssl_certificate     /etc/letsencrypt/live/cms-staging.joellithgow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms-staging.joellithgow.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS redirects
server {
    listen 80;
    server_name cms.joellithgow.com cms-staging.joellithgow.com;
    return 301 https://$host$request_uri;
}
