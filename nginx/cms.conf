# Nginx config for CMS subdomains
# Deploy to /etc/nginx/sites-available/cms.conf and symlink to sites-enabled/
# SSL certs provisioned via: /ssl-setup user@host cms.joellithgow.com
#                         and /ssl-setup user@host cms-staging.joellithgow.com
#
# The /mcp routes below are token-gated via $mcp_authorized, which is defined by
# a server-side map in /etc/nginx/conf.d/mcp-token.conf (NOT in this repo — it
# holds the real bearer token). Copy nginx/mcp-token.conf.example there and fill
# in the token. Without that file, nginx will fail to load ($mcp_authorized
# undefined), which is the safe failure — no ungated /mcp.

server {
    listen 443 ssl;
    server_name cms.joellithgow.com;

    ssl_certificate     /etc/letsencrypt/live/cms.joellithgow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.joellithgow.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Content MCP (cms-mcp sidecar, loopback :8002). Token-gated; streaming.
    location /mcp {
        if ($mcp_authorized != 1) { return 401; }

        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gateway MCP (cms-gateway-mcp sidecar, loopback :8003). Same token gate.
    location /mcp/gateway {
        if ($mcp_authorized != 1) { return 401; }

        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name cms-staging.joellithgow.com;

    ssl_certificate     /etc/letsencrypt/live/cms-staging.joellithgow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms-staging.joellithgow.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS redirects
server {
    listen 80;
    server_name cms.joellithgow.com cms-staging.joellithgow.com;
    return 301 https://$host$request_uri;
}
