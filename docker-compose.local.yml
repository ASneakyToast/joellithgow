# Local development CMS backend.
# Mirrors cms-staging but uses a separate volume so local experiments
# don't affect EC2 staging. Restore content with: make db-sync
#
# Start with:  docker compose -f docker-compose.local.yml up -d
# (Or just:    make cms-up)

services:
  cms-local:
    build:
      context: ..
      dockerfile: joellithgow/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./cms:/app/joellithgow/cms
      - cms_data_local:/app/joellithgow/cms/data
      # DEBUG/dev: bind-mount astraeus source over the build-time COPY so JS rebuilds
      # (npm run build) and Python edits (--reload) apply on refresh, no image rebuild.
      - ../astraeus/packages/starlette-editor/starlette_editor/static:/app/astraeus/packages/starlette-editor/starlette_editor/static
      - ../astraeus/packages/starlette-chat/src/starlette_chat:/app/astraeus/packages/starlette-chat/src/starlette_chat
      - ../astraeus/packages/starlette-cms/starlette_cms:/app/astraeus/packages/starlette-cms/starlette_cms
    environment:
      - DATABASE_URL=sqlite:////app/joellithgow/cms/data/content.db
      - CMS_API_KEY=${CMS_LOCAL_API_KEY:-local-secret}
      - PICCOLO_CONF=piccolo_conf
      - SQLITE_PATH=/app/joellithgow/cms/data/content.db
      # NETLIFY_BUILD_HOOK_URL intentionally unset — local must not fire prod builds.
      # To smoke-test the rebuild button locally, set it to a throwaway URL in .env.
      - NETLIFY_BUILD_HOOK_URL=${NETLIFY_BUILD_HOOK_URL:-}
      - INATURALIST_USERNAME=${INATURALIST_USERNAME:-joel583}
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      - SPOTIPY_REFRESH_TOKEN=${SPOTIPY_REFRESH_TOKEN}
      # Inline editor session auth — set CMS_SESSION_SECRET + CMS_ADMIN_USERS in .env for real creds
      # Default local dev values: user=joel password=admin
      - CMS_SESSION_SECRET=${CMS_SESSION_SECRET:-b5e51d3bc4cf77baf73ef30fabdadf74a7252ce7820c473e3dfac4676b675d2c}
      - CMS_ADMIN_USERS=${CMS_ADMIN_USERS:-{"joel":"$$2b$$12$$GrL0yeSElwUQl1fhzu9RwO4ZhTJSYz30F/CLiJ6iJnHbEv9X4dwk2"}}
      # CORS origins for the embed script — covers both common Astro dev ports
      - CMS_CORS_ORIGINS=${CMS_CORS_ORIGINS:-http://localhost:4321,http://localhost:4322,http://localhost:4323}
      # Observability — enable console span output in local dev; set OTEL_EXPORTER_OTLP_ENDPOINT for prod export
      - ASTRAEUS_ENABLE_CONSOLE=${ASTRAEUS_ENABLE_CONSOLE:-false}
      # AI chat — LiteLLM proxy with gpt-4o-mini for reliable tool calling.
      # Switch OPENAI_BASE_URL + CHAT_MODEL in .env to use local LM Studio instead.
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://litellm.ops.ml.lzrops.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CHAT_MODEL=${CHAT_MODEL:-gpt-4o-mini}
    # Ensures host.docker.internal resolves to the Mac host over IPv4 (Docker Desktop
    # only injects an IPv6 entry by default; httpx needs IPv4 to reach localhost:4322).
    # NOTE: This IP is the Docker bridge gateway — may change if Docker recreates the network.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cms_data_local:
    driver: local
