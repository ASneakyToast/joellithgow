# Local development CMS backend.
# Mirrors cms-staging but uses a separate volume so local experiments
# don't affect EC2 staging. Restore content with: make db-sync
#
# Start with:  docker compose -f docker-compose.local.yml up -d
# (Or just:    make cms-up)

services:
  cms-local:
    build:
      context: ..
      dockerfile: joellithgow/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./cms:/app/joellithgow/cms
      - cms_data_local:/app/joellithgow/cms/data
    environment:
      - DATABASE_URL=sqlite:////app/joellithgow/cms/data/content.db
      - CMS_API_KEY=${CMS_LOCAL_API_KEY:-local-secret}
      - PICCOLO_CONF=piccolo_conf
      - SQLITE_PATH=/app/joellithgow/cms/data/content.db
      - INATURALIST_USERNAME=${INATURALIST_USERNAME:-joel583}
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      - SPOTIPY_REFRESH_TOKEN=${SPOTIPY_REFRESH_TOKEN}
      # Inline editor session auth — set CMS_SESSION_SECRET + CMS_ADMIN_USERS in .env for real creds
      # Default local dev values: user=joel password=admin
      - CMS_SESSION_SECRET=${CMS_SESSION_SECRET:-b5e51d3bc4cf77baf73ef30fabdadf74a7252ce7820c473e3dfac4676b675d2c}
      - CMS_ADMIN_USERS=${CMS_ADMIN_USERS:-{"joel":"$$2b$$12$$GrL0yeSElwUQl1fhzu9RwO4ZhTJSYz30F/CLiJ6iJnHbEv9X4dwk2"}}

volumes:
  cms_data_local:
    driver: local
