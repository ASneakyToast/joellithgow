# The image is built in CI (.github/workflows/build-cms.yml) and pulled here —
# the box has 908MB of RAM and building on it OOM-killed BuildKit. `build:` is
# retained so `docker compose build` still works locally.

services:
  cms-prod:
    image: ghcr.io/asneakytoast/joellithgow-cms:latest
    build:
      context: ..
      dockerfile: joellithgow/Dockerfile
    # Prod command: no --reload (dev-only; caused a WatchFiles reload loop as uv
    # re-synced the venv), and --no-sync so uv uses the image's prebuilt venv
    # instead of churning editable packages on every start.
    command: ["uv", "run", "--no-sync", "uvicorn", "cms.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./cms:/app/joellithgow/cms
      - cms_data_prod:/app/joellithgow/cms/data
    environment:
      - DATABASE_URL=sqlite:////app/joellithgow/cms/data/content.db
      - CMS_API_KEY=${CMS_API_KEY}
      - PICCOLO_CONF=piccolo_conf
      - SQLITE_PATH=/app/joellithgow/cms/data/content.db
      # Session auth for the inline editor (login gates editing; public site unaffected)
      - CMS_SESSION_SECRET=${CMS_SESSION_SECRET}
      - CMS_ADMIN_USERS=${CMS_ADMIN_USERS}
      # CORS so embed.js on the Netlify site can make credentialed requests
      - CMS_CORS_ORIGINS=${CMS_CORS_ORIGINS}
      # AI chat (starlette-chat) — OpenRouter provider
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHAT_MODEL=${CHAT_MODEL}
      # Manual "Rebuild site" editor button → POSTs this Netlify build hook.
      # Prod only — staging/local omit it so they can't trigger a prod deploy.
      - NETLIFY_BUILD_HOOK_URL=${NETLIFY_BUILD_HOOK_URL}
      # Gateways (Spotify + iNaturalist) — manual sync via /gateways/
      - INATURALIST_USERNAME=${INATURALIST_USERNAME:-joel583}
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      - SPOTIPY_REFRESH_TOKEN=${SPOTIPY_REFRESH_TOKEN}
    restart: unless-stopped

  cms-staging:
    image: ghcr.io/asneakytoast/joellithgow-cms:latest
    build:
      context: ..
      dockerfile: joellithgow/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./cms:/app/joellithgow/cms
      - cms_data_staging:/app/joellithgow/cms/data
    environment:
      - DATABASE_URL=sqlite:////app/joellithgow/cms/data/content.db
      - CMS_API_KEY=${CMS_STAGING_API_KEY:-staging-secret}
      - PICCOLO_CONF=piccolo_conf
      - SQLITE_PATH=/app/joellithgow/cms/data/content.db
      # Session auth. Without CMS_SESSION_SECRET the CMS never registers the
      # /api/auth/* routes at all, so /editor/shell redirected to a login page
      # that returned 404 — staging could not be signed into.
      #
      # Same admin credentials as prod (same person), but a distinct signing
      # secret so a session minted on staging cannot be replayed against prod.
      - CMS_SESSION_SECRET=${CMS_STAGING_SESSION_SECRET}
      - CMS_ADMIN_USERS=${CMS_ADMIN_USERS}
      # NETLIFY_BUILD_HOOK_URL intentionally unset — staging must not fire prod builds.
      - INATURALIST_USERNAME=${INATURALIST_USERNAME:-joel583}
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      - SPOTIPY_REFRESH_TOKEN=${SPOTIPY_REFRESH_TOKEN}
    restart: unless-stopped

  # Content MCP sidecar — starlette-cms CRUD/publish tools over streamable-http.
  # Bound to loopback so nginx (/mcp, token-gated) is the only way in; the port
  # is unreachable from outside the box even if the security group is loose.
  cms-mcp:
    image: ghcr.io/asneakytoast/joellithgow-cms:latest
    build:
      context: ..
      dockerfile: joellithgow/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-m", "cms.mcp_server", "--transport", "streamable-http", "--port", "8002"]
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./cms:/app/joellithgow/cms
    environment:
      - CMS_URL=http://cms-prod:8000
      - CMS_API_KEY=${CMS_API_KEY}
    depends_on:
      - cms-prod
    restart: unless-stopped

  # Gateway MCP sidecar — Spotify/iNaturalist sync tools over streamable-http.
  # Loopback-bound; fronted by nginx /mcp/gateway (same token gate).
  cms-gateway-mcp:
    image: ghcr.io/asneakytoast/joellithgow-cms:latest
    build:
      context: ..
      dockerfile: joellithgow/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-m", "cms.gateway_mcp_server", "--transport", "streamable-http", "--port", "8003"]
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./cms:/app/joellithgow/cms
    environment:
      - CMS_URL=http://cms-prod:8000
      - CMS_API_KEY=${CMS_API_KEY}
    depends_on:
      - cms-prod
    restart: unless-stopped

volumes:
  cms_data_prod:
    driver: local
  cms_data_staging:
    driver: local
